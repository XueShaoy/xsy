name: Deploy Hugo site to OSS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-oss
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.162.1
      HUGO_BASE_URL: https://xueshaoyang.cn/
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --gc --minify --baseURL "${HUGO_BASE_URL}"

      - name: Install ossutil
        env:
          OSSUTIL_VERSION: 2.3.0
        run: |
          curl -fsSL -o ossutil.zip "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/ossutil-${OSSUTIL_VERSION}-linux-amd64.zip"
          unzip -q ossutil.zip
          sudo install -m 755 "ossutil-${OSSUTIL_VERSION}-linux-amd64/ossutil" /usr/local/bin/ossutil
          ossutil version

      - name: Deploy to OSS
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_REGION_SECRET: ${{ secrets.OSS_REGION }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          # 优先使用 OSS_REGION（如 cn-beijing）；否则从 OSS_ENDPOINT 推导
          if [ -n "${OSS_REGION_SECRET}" ]; then
            OSS_REGION="${OSS_REGION_SECRET}"
          else
            OSS_REGION="$(echo "${OSS_ENDPOINT}" | sed -E 's#^https?://##; s/^oss-//; s/\.aliyuncs\.com$//')"
          fi

          # region 必须形如 cn-beijing，否则说明 endpoint/region 配置有误
          if ! echo "${OSS_REGION}" | grep -Eq '^[a-z]+-[a-z0-9-]+$'; then
            echo "::error::无法得到合法 region（当前: '${OSS_REGION}'）。请把 OSS_ENDPOINT 设为 oss-cn-beijing.aliyuncs.com，或新增 OSS_REGION=cn-beijing。"
            exit 1
          fi

          # 始终使用标准公网 endpoint，避免误配成账号专属域名
          CLEAN_ENDPOINT="oss-${OSS_REGION}.aliyuncs.com"
          echo "Using region: ${OSS_REGION} / endpoint: ${CLEAN_ENDPOINT}"

          ossutil sync ./public/ "oss://${OSS_BUCKET}/" -f --delete \
            -e "${CLEAN_ENDPOINT}" \
            -i "${OSS_ACCESS_KEY_ID}" \
            -k "${OSS_ACCESS_KEY_SECRET}" \
            --region "${OSS_REGION}"
